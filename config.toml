[drive_settings]
Source_Music_Folder = "12y2cjGE7GE3MTJ8QtNs3_Z5L30o5Ql6D" # The LTBB folder containing all the sheet music. Currently organized in folders like 'A-C', 'D-F', etc
Destination_Music_Folder = "1h-T2mnFrr0VpafBDJ3nv3vvO_xLGir9t" # The folder where the MobileSheets database and PDFs will end up
Instrument_Parts_Folder = "MobileSheets Databases" # Name of the subfolder (inside Destination_Music_Folder) that holds the per-instrument part folders
Seasonal_Songs = "1M7sLr9wwvHJIfKGijRTSjC5ae1CODzbY" # Some subfolders that contain additional songs not in the alphabetic folders
Ignore_Folders = ['2. Seasonal Songs', '3. Warm-ups', '4. 3rd Rail Drumline', '5. Resources', '6. Recordings']
Ignore_Docs = ['1DylyWhzPOjKYJr6TAbeGhHUVXb1hi9GUkua3URtzr4c', '1lYz54_jarIxfqZu0vVebfcRIBykGsikdSs3QNhlecU0']

[instrumentation.instruments]
# Names by which these instruments might appear in the titles of the PDF files - includes some interesting typos
Score = ["Score"]
Tuba = ["Tuba", "Sousaphone", "Sousa", "Low Brass", "Basses", "Bass (Treble Clef)", "Bass_Line", "Melody (BC)", "Background (BC)", "Bassline (BC)"]
Horn = ["Horn in F", "F Horn", "Mellophone", "Horns F", "Melody (F)", "Background (F)"]
Percussion = ["Percussion", "Drum", "Snareline", "Perc", "BassDr", "Snare", "Congo", "Toms", "Quads", "Cymbal", "Glockenspiel"]
Clarinet = ["Clarinet", "Bb Sopranos", "Melody (Bb)", "Background (Bb)", "Bassline (Bb)"]
"Soprano Sax" = ["Soprano", "Melody (Bb)", "Background (Bb)", "Bassline (Bb)"]
"Alto Sax" = ["Alto", "Melody (Eb)", "Background (Eb)", "Bassline (Eb)"]
"Tenor Sax" = ["Tenor", "Melody (Bb)", "Background (Bb)", "Bassline (Bb)"]
"Bari Sax" = ["Bari", "Melody (Eb)", "Background (Eb)", "Bassline (Eb)"]
"Bass Sax" = ["Bass Sax", "Bass Saxophone", "Melody (Bb)", "Background (Bb)", "Bassline (Bb)"]
Trumpet = ["Trumpet", "Flugelhorn", "Trmp", "Trumplet", "Melody (Bb)", "Background (Bb)", "Bassline (Bb)"]
Trombone = ["Trombone", "Tbn", "Trmb", "Bone", "Low Brass", "Melody (BC)", "Background (BC)", "Bassline (BC)"]
"Eb Horn" = ["Eb Horn", "Horn in Eb", "Tenor Horn", "Melody (Eb)", "Background (Eb)", "Bassline (Eb)"]
Flute = ["Flute", "C Woodwind", "Melody (C)", "Background (C)"]
Euph = ["Euphonium", "Euph", "B Flat Bass (Trebel Cleff)", "Melody (Eb)", "Background (Eb)", "Bassline (Eb)"]

[instrumentation.excluded_part_names]
"Tenor Sax" = ["Tenor Horn"]

# Does your instrument not have a part for this song? Use a backup part!
# Horn included as a backup here so we don"t accidentally pick up a zillion Eb Horns without at least trying things like "Horn in F" first
[instrumentation.backup_instruments]
Score = []
Tuba = ["Bass Clef Instruments"]
Horn = ["F Treble Clef Instruments", "Horn"]
Percussion = []
Clarinet = ["Bb Treble Clef Instruments"]
"Soprano Sax" = ["Bb Treble Clef Instruments", "Tenor Sax"]
"Alto Sax" = ["Eb Treble Clef Instruments"]
"Tenor Sax" = ["Bb Treble Clef Instruments"]
"Bari Sax" = ["Eb Treble Clef Instruments"]
"Bass Sax" = ["Bb Treble Clef Instruments", "Tuba"]
Trumpet = ["Bb Treble Clef Instruments"]
Trombone = ["Bass Clef Instruments"]
"Eb Horn" = ["Eb Treble Clef Instruments", "Bari Sax"]
Flute = ["C Treble Clef Instruments"]
Euph = ["Eb Treble Clef Instruments", "Tenor Sax"]

# Separate Soloist parts
[instrumentation.solo_parts]
Score = []
Tuba = ["Soloist (Bass Clef)"]
Horn = ["Soloist (F)"]
Percussion = []
Clarinet = ["Soloist (Bb)"]
"Soprano Sax" = ["Soloist (Bb)"]
"Alto Sax" = ["Soloist (Eb)"]
"Tenor Sax" = ["Soloist (Bb)"]
"Bari Sax" = ["Soloist (Eb)"]
"Bass Sax" = ["Soloist (Bb)"]
Trumpet = ["Soloist (Bb)"]
Trombone = ["Soloist (Bass Clef)"]
"Eb Horn" = ["Soloist (Eb)"]
Flute = ["Soloist (C)"]
Euph = ["Soloist (Bb)"]

